<script>
  // Get the current broken path requested by the user
  var currentPath = window.location.pathname;
  
  // Check if it belongs to the old folder structure
  if (currentPath.startsWith('/QMCSoftware')) {
    // Strip out the old directory name
    var remainingPath = currentPath.replace(/^\/QMCSoftware/, '');
    
    // Build the correct destination URL while keeping queries and hashes
    var newURL = "https://qmcsoftware.org/qmcpy" + remainingPath + window.location.search + window.location.hash;
    
    // Push the user to the correct page immediately
    window.location.replace(newURL);
  } else {
    // Normal 404 text if they typed a completely unrelated broken link
    document.write('<h1>Page Not Found</h1><p>Go back to <a href="https://qmcsoftware.org/qmcpy/">QMCPy Home</a>.</p>');
  }
</script>


<script id="quarto-html-after-body" type="application/javascript">
  window.document.addEventListener("DOMContentLoaded", function (event) {
      var localhostRegex = new RegExp(/^(?:http|https):\/\/localhost\:?[0-9]*\//);
      var mailtoRegex = new RegExp(/^mailto:/);
        var filterRegex = new RegExp("https:\/\/qmcsoftware\.org");
      var isInternal = (href) => {
          return filterRegex.test(href) || localhostRegex.test(href) || mailtoRegex.test(href);
      }
      // Inspect non-navigation links and adorn them if external
     var links = window.document.querySelectorAll('a[href]:not(.nav-link):not(.navbar-brand):not(.toc-action):not(.sidebar-link):not(.sidebar-item-toggle):not(.pagination-link):not(.no-external):not([aria-hidden]):not(.dropdown-item):not(.quarto-navigation-tool):not(.about-link)');
      for (var i=0; i<links.length; i++) {
        const link = links[i];
        if (!isInternal(link.href)) {
          // undo the damage that might have been done by quarto-nav.js in the case of
          // links that we want to consider external
          if (link.dataset.originalHref !== undefined) {
            link.href = link.dataset.originalHref;
          }
            // target, if specified
            link.setAttribute("target", "_blank");
            if (link.getAttribute("rel") === null) {
              link.setAttribute("rel", "noopener");
            }
        }
      }
  });
  </script>
