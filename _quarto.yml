project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "blog/**/*.qmd"
    - "news/**/*.qmd"
    - "community/**/*.qmd"
    - "software/**/*.qmd"
    - "publications/**/*.qmd"
  resources:
    - CNAME
    - assets/**
    - data/**

website:
  title: "QMCSoftware"
  site-url: https://qmcpy.org
  description: "Open-source software and shared resources for quasi-Monte Carlo methods."
  navbar:
    background: "#073b4c"
    left:
      - href: index.qmd
        text: Home
      - href: software/index.qmd
        text: Software
      - href: blog/index.qmd
        text: Blog
      - href: publications/index.qmd
        text: Publications
      - href: news/index.qmd
        text: News & Events
      - href: community/index.qmd
        text: Community
    right:
      - href: https://github.com/QMCSoftware
        text: GitHub
  page-footer:
    left: "QMCSoftware — open-source quasi-Monte Carlo software"
    right:
      - href: about.qmd
        text: About this site

format:
  html:
    theme:
      light: [cosmo, styles/custom.scss]
    toc: true
    link-external-newwindow: true
    smooth-scroll: true

execute:
  freeze: auto
